# Pages CMS configuration. Written in JSON syntax (valid YAML) because
# scripts/validate-content.mjs reads the same field rules. Keep it that way.
{
  "media": [
    {
      "name": "photos",
      "label": "Photos",
      "input": "public/photos",
      "output": "/photos",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "JPG",
        "JPEG",
        "PNG",
        "WEBP"
      ]
    },
    {
      "name": "banners",
      "label": "Product and banner images",
      "input": "public/images",
      "output": "/images",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "JPG",
        "JPEG",
        "PNG",
        "WEBP"
      ]
    },
    {
      "name": "logos",
      "label": "Client logos",
      "input": "public/images/clients/logos",
      "output": "/images/clients/logos",
      "rename": "safe",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp",
        "JPG",
        "JPEG",
        "PNG",
        "WEBP"
      ]
    }
  ],
